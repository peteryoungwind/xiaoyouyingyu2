<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>跟读精听 · 已学习空状态</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="stage">
    <article class="phone">
      <div class="screen">
        <div class="status-bar">
          <span>9:41</span>
          <span class="status-icons"><span class="signal"></span><span class="wifi"></span><span class="battery"></span></span>
        </div>
        <div class="app-page">
          <header class="page-title-block">
            <div class="page-label">Learning</div>
            <h1 class="page-title">跟读精听</h1>
            <p class="page-subtitle">学过的素材会自动归档，方便回看和复练。</p>
          </header>

          <nav class="tabs" aria-label="学习状态">
            <a class="tab" href="./01-list-unlearned.html">未学习</a>
            <a class="tab active" href="./02-list-learned-empty.html">已学习</a>
          </nav>

          <section class="empty-box">
            <div class="empty-icon">✓</div>
            <h2 class="empty-title">学过的内容会出现在这里</h2>
            <p class="empty-desc">点开任意跟读精听资源后，它会自动进入已学习列表。先去挑一条喜欢的原声素材吧。</p>
            <div style="margin-top: 22px;">
              <a class="primary-btn" href="./01-list-unlearned.html">去学习</a>
            </div>
          </section>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
