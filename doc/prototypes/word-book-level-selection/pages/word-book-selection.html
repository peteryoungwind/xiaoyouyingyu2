<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>选择单词本</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <main class="phone-shell" aria-label="微信小程序页面原型">
    <section class="miniapp-page">
      <header class="page-header">
        <p class="eyebrow">Word Practice</p>
        <h1>选择单词本</h1>
        <p>按当前阶段选择词书，系统会记住你的最近选择。</p>
      </header>

      <section class="level-section beginner">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Beginner</p>
            <h2>初级词书</h2>
          </div>
          <span>3 本</span>
        </div>

        <div class="book-grid">
          <article class="book-card selected">
            <div class="cover cover-life">
              <span class="cover-mark">Daily</span>
            </div>
            <div class="book-info">
              <h3>日常生活高频词</h3>
              <p>126 词 · 已学 38</p>
            </div>
          </article>

          <article class="book-card">
            <div class="cover cover-travel">
              <span class="cover-mark">Trip</span>
            </div>
            <div class="book-info">
              <h3>旅行开口词库</h3>
              <p>92 词 · 待复习 8</p>
            </div>
          </article>

          <article class="book-card">
            <div class="cover cover-campus">
              <span class="cover-mark">Study</span>
            </div>
            <div class="book-info">
              <h3>校园与学习表达</h3>
              <p>108 词 · 未开始</p>
            </div>
          </article>
        </div>
      </section>

      <section class="level-section advanced">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Advanced</p>
            <h2>进阶词书</h2>
          </div>
          <span>2 本</span>
        </div>

        <div class="book-grid">
          <article class="book-card">
            <div class="cover cover-business">
              <span class="cover-mark">Biz</span>
            </div>
            <div class="book-info">
              <h3>商务英语进阶</h3>
              <p>180 词 · 已学 64</p>
            </div>
          </article>

          <article class="book-card">
            <div class="cover cover-news">
              <span class="cover-mark">News</span>
            </div>
            <div class="book-info">
              <h3>外刊表达升级</h3>
              <p>220 词 · 待复习 13</p>
            </div>
          </article>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
