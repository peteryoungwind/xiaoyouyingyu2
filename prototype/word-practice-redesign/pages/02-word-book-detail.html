<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>单词本学习首页原型</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="stage">
      <nav class="prototype-nav">
        <a href="./01-word-books.html">上一页</a>
        <a href="./03-word-practice.html">下一页</a>
      </nav>

      <section class="phone" aria-label="单词本学习首页">
        <div class="status-bar">
          <span>9:41</span>
          <span>●●●  5G  ▰</span>
        </div>

        <div class="mobile-page">
          <header class="top-card">
            <button aria-label="返回">‹</button>
            <div>
              <h1>日常生活高频词</h1>
              <p>日常表达、家庭、出行和购物</p>
            </div>
            <button aria-label="刷新">↻</button>
          </header>

          <section class="study-hero">
            <p class="eyebrow">Today</p>
            <h2>先复习，再学习新词</h2>
            <p>系统会优先给出到期复习词，没有到期复习词时进入新词。</p>
            <button class="primary-button">开始练习</button>
          </section>

          <section class="control-card">
            <div class="section-title">难度</div>
            <div class="segmented">
              <button class="active">初级</button>
              <button>进阶</button>
            </div>
          </section>

          <section class="progress-grid">
            <article>
              <span>总词数</span>
              <strong>80</strong>
            </article>
            <article>
              <span>已学</span>
              <strong>46</strong>
            </article>
            <article>
              <span>待复习</span>
              <strong>18</strong>
            </article>
            <article>
              <span>已掌握</span>
              <strong>18</strong>
            </article>
          </section>

          <section class="word-preview">
            <div class="section-title">最近学习</div>
            <div class="mini-word">
              <span>adjust</span>
              <b>适应，调整</b>
              <i>明天复习</i>
            </div>
            <div class="mini-word">
              <span>routine</span>
              <b>日常安排</b>
              <i>已掌握</i>
            </div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
