<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>单词练习页原型</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="stage">
      <nav class="prototype-nav">
        <a href="./02-word-book-detail.html">上一页</a>
        <a href="./04-word-detail.html">详情页</a>
      </nav>

      <section class="phone" aria-label="单词练习页">
        <div class="status-bar">
          <span>9:41</span>
          <span>●●●  5G  ▰</span>
        </div>

        <div class="practice-page">
          <header class="top-card compact">
            <button aria-label="返回">‹</button>
            <div>
              <h1>日常生活高频词</h1>
              <p>初级 · 已学 46/80 · 待复习 18</p>
            </div>
            <button aria-label="详情">⋯</button>
          </header>

          <section class="word-stage">
            <div class="review-chip">到期复习</div>
            <h2>adjust</h2>
            <div class="sound-row">
              <button>美</button>
              <button>英</button>
              <span>/əˈdʒʌst/</span>
            </div>
            <div class="memory-lines">
              <span></span>
              <span></span>
            </div>
          </section>

          <section class="revealed-detail">
            <div class="section-title">答错后展开状态</div>
            <div class="definition-row">
              <span>v.</span>
              <strong>适应；调整</strong>
            </div>
            <p>to change something slightly so that it works better or fits a new situation.</p>
            <div class="example-card">
              <button>▶</button>
              <div>
                <b>I need time to adjust to the new routine.</b>
                <span>我需要时间适应新的日常安排。</span>
              </div>
            </div>
          </section>

          <section class="answer-panel bottom-actions">
            <button class="known">认识</button>
            <button class="fuzzy">模糊</button>
            <button class="unknown">不认识</button>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
