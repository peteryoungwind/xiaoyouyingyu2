<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>换词书与复盘原型</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="stage">
      <nav class="prototype-nav">
        <a href="./04-word-reveal.html">上一页</a>
        <a href="../index.html">原型目录</a>
      </nav>

      <section class="phone" aria-label="换词书与复盘">
        <div class="status-bar">
          <span>9:41</span>
          <span>5G  100%</span>
        </div>

        <div class="mobile-page">
          <header class="page-header">
            <button class="icon-button" aria-label="返回">‹</button>
            <div class="page-title" style="text-align: center;">
              <p class="eyebrow">Review</p>
              <h1>练习复盘</h1>
            </div>
            <button class="icon-button" aria-label="关闭">×</button>
          </header>

          <section class="result-card">
            <p class="eyebrow">Today</p>
            <h2>本轮完成 26 个单词</h2>
            <p>认识 16 个，模糊 7 个，不认识 3 个。系统已自动安排下一次复习。</p>
            <div class="score-row">
              <div><strong>62%</strong><span>熟悉率</span></div>
              <div><strong>+8</strong><span>新词</span></div>
            </div>
          </section>

          <section class="glass-card">
            <div class="card-row">
              <div>
                <p class="eyebrow">Switch Book</p>
                <h2>切换词书</h2>
              </div>
              <button class="text-button">管理</button>
            </div>
            <div class="book-list">
              <article class="book-tile">
                <div class="book-row">
                  <div>
                    <h2>日常生活高频词</h2>
                    <p>当前词书 · 初级</p>
                  </div>
                  <span class="active-mark">✓</span>
                </div>
                <div class="book-meta">
                  <span>待复习 0</span>
                  <span>掌握 126</span>
                  <span>进度 64%</span>
                </div>
              </article>
              <article class="book-tile">
                <div class="book-row">
                  <div>
                    <h2>旅行与城市</h2>
                    <p>交通、住宿、文化体验</p>
                  </div>
                  <span>›</span>
                </div>
                <div class="book-meta">
                  <span>待复习 12</span>
                  <span>掌握 18</span>
                  <span>进度 22%</span>
                </div>
              </article>
            </div>
          </section>

          <section class="bottom-sheet">
            <h2>下一步</h2>
            <p class="subtle-text">复盘结束后回到首页；继续练习会直接加载当前词书的下一组。</p>
            <div class="sheet-actions">
              <button class="secondary-button">回首页</button>
              <button class="primary-button" style="margin: 0;">继续练习</button>
            </div>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
