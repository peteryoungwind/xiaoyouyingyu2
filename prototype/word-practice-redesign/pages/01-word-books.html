<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>单词本列表原型</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="stage">
      <nav class="prototype-nav">
        <a href="../index.html">原型目录</a>
        <a href="./02-word-book-detail.html">下一页</a>
      </nav>

      <section class="phone" aria-label="单词本列表">
        <div class="status-bar">
          <span>9:41</span>
          <span>●●●  5G  ▰</span>
        </div>

        <div class="mobile-page">
          <header class="page-hero">
            <p class="eyebrow">Word Practice</p>
            <h1>选择单词本</h1>
            <p>到期复习优先，新词随后出现。</p>
          </header>

          <section class="summary-strip">
            <div>
              <span>今日待复习</span>
              <strong>18</strong>
            </div>
            <div>
              <span>已掌握</span>
              <strong>126</strong>
            </div>
          </section>

          <section class="book-list">
            <article class="book-card featured">
              <div class="book-top">
                <div>
                  <h2>日常生活高频词</h2>
                  <p>围绕日常表达、家庭、出行和购物。</p>
                </div>
                <span>›</span>
              </div>
              <div class="progress-track"><i style="width: 58%"></i></div>
              <div class="metric-grid">
                <div><strong>80</strong><span>初级词</span></div>
                <div><strong>72</strong><span>进阶词</span></div>
                <div><strong>46</strong><span>已学</span></div>
                <div><strong>18</strong><span>掌握</span></div>
              </div>
            </article>

            <article class="book-card">
              <div class="book-top">
                <div>
                  <h2>校园与学习</h2>
                  <p>课堂讨论、作业计划、学习习惯。</p>
                </div>
                <span>›</span>
              </div>
              <div class="progress-track"><i style="width: 32%"></i></div>
              <div class="metric-grid">
                <div><strong>64</strong><span>初级词</span></div>
                <div><strong>58</strong><span>进阶词</span></div>
                <div><strong>21</strong><span>已学</span></div>
                <div><strong>7</strong><span>掌握</span></div>
              </div>
            </article>

            <article class="book-card">
              <div class="book-top">
                <div>
                  <h2>旅行与城市</h2>
                  <p>交通、住宿、景点和文化体验。</p>
                </div>
                <span>›</span>
              </div>
              <div class="progress-track"><i style="width: 16%"></i></div>
              <div class="metric-grid">
                <div><strong>52</strong><span>初级词</span></div>
                <div><strong>45</strong><span>进阶词</span></div>
                <div><strong>9</strong><span>已学</span></div>
                <div><strong>3</strong><span>掌握</span></div>
              </div>
            </article>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
