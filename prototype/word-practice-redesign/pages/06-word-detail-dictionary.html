<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>单词详情词典卡原型</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <main class="stage">
      <nav class="prototype-nav">
        <a href="./04-word-reveal.html">答后展开</a>
        <a href="../index.html">原型目录</a>
      </nav>

      <section class="phone" aria-label="单词详情词典卡">
        <div class="status-bar dictionary-status">
          <span>9:41</span>
          <span>5G  100%</span>
        </div>

        <div class="dictionary-page">
          <header class="dictionary-toolbar">
            <button class="round-button" aria-label="返回">‹</button>
            <div class="dictionary-toolbar-title">
              <span>到期复习 · 12/30</span>
              <strong>日常生活高频词</strong>
            </div>
            <button class="round-button" aria-label="收藏">☆</button>
          </header>

          <section class="dictionary-hero">
            <div class="dictionary-word-row">
              <h1>crisp</h1>
              <button class="hero-sound-button" aria-label="播放单词发音">
                <span class="sound-glyph" aria-hidden="true"></span>
              </button>
            </div>

            <div class="dictionary-phonetic">
              <button>英 <span>♪</span></button>
              <button>美 <span>♪</span></button>
              <span>/krisp/</span>
            </div>

            <div class="meaning-lines" aria-label="释义">
              <p><span class="part">adj.</span><mark>脆的</mark><mark>酥脆的</mark><mark>挺括的</mark><mark>凉爽的</mark></p>
              <p><span class="part">n.</span><mark>炸薯片</mark><mark>水果酥</mark></p>
              <p><span class="part">vi. vt.</span><mark>（使）变脆</mark></p>
            </div>
          </section>

          <section class="dictionary-card example-dictionary-card">
            <button class="mini-sound-button" aria-label="播放例句语音">
              <span class="sound-glyph" aria-hidden="true"></span>
            </button>
            <p class="example-en">I recommend <strong>crisp</strong> beef and fried duck.</p>
            <p class="example-zh">向您推荐香酥牛肉和锅烧鸭。</p>
          </section>

          <section class="dictionary-card phrase-card">
            <div class="phrase-row">
              <span>crisp lettuce</span>
              <strong>脆生菜</strong>
            </div>
            <div class="phrase-row">
              <span>a crisp morning</span>
              <strong>凉爽的早上</strong>
            </div>
            <div class="phrase-row">
              <span>a packet of crisps</span>
              <strong>一袋薯片</strong>
            </div>
          </section>

          <section class="dictionary-card memory-card">
            <div>
              <span class="memory-label">记忆提示</span>
              <p>形容食物时强调“咬下去清脆”；形容天气时更接近“清爽利落”。</p>
            </div>
            <button>重点复习</button>
          </section>

          <section class="dictionary-actions">
            <button class="known-action">认识</button>
            <button class="unknown-action">不认识</button>
            <button class="next-action">下一词</button>
          </section>
        </div>
      </section>
    </main>
  </body>
</html>
