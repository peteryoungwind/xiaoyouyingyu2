<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小柚英语 - 用户提交话题入口原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="prototype-shell">
      <section class="index-hero">
        <span class="eyebrow">Prototype</span>
        <h1>用户提交感兴趣话题 - 入口方案原型</h1>
        <p class="lead">
          这组原型聚焦入口布局和管理闭环：小程序首页封面改成两张轮播，主题列表页放辅助横幅，
          PC 管理后台提供待处理列表。
        </p>
      </section>

      <section class="page-grid" aria-label="原型页面列表">
        <a class="page-link-card" href="./pages/01-miniapp-home-entry.html">
          <strong>01 小程序首页入口</strong>
          <span>首页封面改成两张轮播，默认是当前 Daily Practice，第二张是柔和的提交话题入口。</span>
        </a>
        <a class="page-link-card" href="./pages/02-miniapp-topics-entry.html">
          <strong>02 主题列表辅助入口</strong>
          <span>搜索和筛选下方放“没找到想练的话题？”横幅，承接用户找不到内容时的真实动机。</span>
        </a>
        <a class="page-link-card" href="./pages/03-miniapp-submit-flow.html">
          <strong>03 提交表单与成功态</strong>
          <span>表单保持短路径：话题名称、想练原因、标签、可选补充。提交后引导查看记录。</span>
        </a>
        <a class="page-link-card" href="./pages/05-admin-submissions.html">
          <strong>04 管理后台处理台</strong>
          <span>后台新增“用户提交话题”，支持查看、采纳为正式主题、驳回和备注。</span>
        </a>
      </section>
    </main>
  </body>
</html>
